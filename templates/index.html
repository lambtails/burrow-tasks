<!doctype html>
<html>

<head>
    <title>Burrow tasks</title>
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, user-scalable=yes"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <h1>BURROW TASKS</h1>
    <hr />
    <form
        method="POST"
        class="add-task-form"
    >
        <input
            type="text"
            name="description"
            autocomplete="off"
            placeholder=""
            required
        />
        <input
            type="submit"
            value="ADD TASK"
        />
    </form>
    <hr />
    <ul class="sortable-list"> {% for task in data %} {% if task[3] == false %} <li
            class="sortable-item"
            draggable="true"
        >
            <input
                type="checkbox"
                id="task-{{task[0]}}"
                autocomplete="off"
                {% if task[2] %}checked{% endif %}
            />
            <label for="task-{{task[0]}}">{{task[1]}}</label>
        </li> {% endif %}{% endfor %} </ul>
    <script src="{{ url_for('static', filename='burrow-tasks.js') }}"></script>
</body>

</html>
